name: Release

# Runs only when a person starts it. Publishing is not something a push should
# do on its own: the version in package.json is bumped in an ordinary reviewed
# pull request, and this is the separate, deliberate act of pushing that version
# to the registry.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the version being published, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the version matches what was asked for
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "${{ inputs.confirm }}" ]; then
            echo "package.json is $VERSION but the run asked for ${{ inputs.confirm }}." >&2
            echo "Nothing was published." >&2
            exit 1
          fi

      - name: Lint, typecheck, build and test
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Publish
        id: publish
        run: pnpm changeset publish --no-git-tag
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Ties the published tarball to this commit and this run, which is a
          # claim a security tool should be able to make about itself. The job
          # already requests id-token: write; this is what spends it. There is no
          # flag for it here, because changesets shells out to pnpm and pnpm to
          # npm, and only the environment survives both hops.
          NPM_CONFIG_PROVENANCE: true

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it alone"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          # The changelog already describes this release. Generated notes list
          # the pull requests that went into it, which is a different and worse
          # answer to the same question, so they are only the fallback.
          if node scripts/changelog-section.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"; then
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "No changelog section for $VERSION; falling back to generated notes" >&2
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
